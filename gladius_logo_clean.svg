<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 10 368 368" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#141210;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#1C1C1C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#221E1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#D4A853;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4A882;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#8B7355;stop-opacity:0" />
      <stop offset="20%"  style="stop-color:#C4A882;stop-opacity:1" />
      <stop offset="80%"  style="stop-color:#C4A882;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#9A9A9A;stop-opacity:1" />
      <stop offset="35%"  style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#F8F8F8;stop-opacity:1" />
      <stop offset="65%"  style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9A9A9A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pommelGrad" cx="38%" cy="35%" r="55%">
      <stop offset="0%"   style="stop-color:#F0C878;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A4A10;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="40%"  style="stop-color:#E8A958;stop-opacity:1" />
      <stop offset="60%"  style="stop-color:#F0C070;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0621E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="silverGlow" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bronzeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="100" y="10" width="368" height="368" fill="url(#bgGrad)"/>


  <rect x="0" y="448" width="1500" height="0.4" fill="url(#goldH)" opacity="0.2"/>


  <rect x="1437" y="48" width="3" height="404" fill="url(#goldGrad)" opacity="0.3"/>
  <rect x="1431" y="48" width="1" height="404" fill="url(#goldGrad)" opacity="0.15"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEFT TEMPLE                                             -->
  <!-- Temple spans x=136 to x=424, centre=280, width=288    -->
  <!-- 4 cols width=18, symmetrically placed around x=280     -->
  <!-- Col1:x=148  Col2:x=220  [sword at 280]  Col3:x=322  Col4:x=394 -->
  <!-- Gap col2→col3: 238 to 322 = 84px, centre=(238+322)/2=280 ✓     -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Pediment: apex (280,80), base (136,140)-(424,140) -->
  <polygon points="280,80 424,140 136,140"
           fill="url(#goldGrad)" opacity="0.7" filter="url(#glow)"/>
  <polygon points="280,92 410,140 150,140"
           fill="#1C1C1C" opacity="0.3"/>

  <!-- Entablature -->
  <rect x="132" y="140" width="296" height="16" fill="url(#goldGrad)" opacity="0.75"/>

  <!-- 4 Columns -->
  <rect x="148" y="156" width="18" height="118" rx="2" fill="url(#goldGrad)" opacity="0.75"/>
  <rect x="220" y="156" width="18" height="118" rx="2" fill="url(#goldGrad)" opacity="0.75"/>
  <rect x="322" y="156" width="18" height="118" rx="2" fill="url(#goldGrad)" opacity="0.75"/>
  <rect x="394" y="156" width="18" height="118" rx="2" fill="url(#goldGrad)" opacity="0.75"/>

  <!-- Column capitals -->
  <rect x="144" y="154" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="216" y="154" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="318" y="154" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="390" y="154" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Column bases -->
  <rect x="144" y="271" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="216" y="271" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="318" y="271" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="390" y="271" width="26" height="5" rx="1" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Steps -->
  <rect x="128" y="276" width="304" height="12" rx="1" fill="url(#goldGrad)" opacity="0.7"/>
  <rect x="116" y="288" width="328" height="10" rx="1" fill="url(#goldGrad)" opacity="0.6"/>
  <rect x="104" y="298" width="352" height="10" rx="1" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- LEFT SWORD — centred at x=280, fully connected, bigger -->
  <!-- Pommel cy=108 r=13, bottom=121                          -->
  <!-- Grip y=121 to y=148                                     -->
  <!-- Crossguard y=148 to y=157                               -->
  <!-- Blade y=157 to y=302                                    -->
  <!-- Blade -->
  <polygon points="280,302 273,254 273,157 287,157 287,254"
           fill="url(#silverGrad)" filter="url(#silverGlow)" opacity="0.92"/>
  <line x1="280" y1="157" x2="280" y2="295" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Crossguard -->
  <rect x="262" y="148" width="36" height="10" rx="3.5"
        fill="url(#bronzeGrad)" filter="url(#glow)" opacity="1"/>
  <circle cx="262" cy="153" r="7.5" fill="url(#pommelGrad)" opacity="1"/>
  <circle cx="298" cy="153" r="7.5" fill="url(#pommelGrad)" opacity="1"/>
  <!-- Grip — directly below pommel, y=121 to y=148 -->
  <rect x="275" y="121" width="10" height="27" rx="2.5"
        fill="url(#bronzeGrad)" opacity="0.88"/>
  <line x1="275" y1="127" x2="285" y2="127" stroke="#1C1C1C" stroke-width="1.2" opacity="0.35"/>
  <line x1="275" y1="133" x2="285" y2="133" stroke="#1C1C1C" stroke-width="1.2" opacity="0.35"/>
  <line x1="275" y1="139" x2="285" y2="139" stroke="#1C1C1C" stroke-width="1.2" opacity="0.35"/>
  <line x1="275" y1="145" x2="285" y2="145" stroke="#1C1C1C" stroke-width="1.2" opacity="0.35"/>
  <!-- Pommel — bottom at y=121, so centre y=108, r=13 -->
  <circle cx="280" cy="108" r="13"
          fill="url(#pommelGrad)" filter="url(#bronzeGlow)" opacity="1"/>
  <circle cx="275" cy="103" r="4" fill="white" opacity="0.18"/>
  <circle cx="280" cy="108" r="8" fill="none" stroke="#7A4A10" stroke-width="1" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ═══════════════════════════════════════════════════════ -->

















</svg>